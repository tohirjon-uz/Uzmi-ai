<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uzmi AI</title>
  <script src="https://puter.com"></script>
  <style>
    body { margin: 0; background: #131314; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    .top { padding: 14px 16px; border-bottom: 1px solid #333; font-size: 18px; font-weight: bold; color: #a8c7fa; display: flex; align-items: center; }
    #chat { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    #hi { font-size: 25px; font-weight: bold; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .cur { display: inline-block; width: 3px; height: 23px; background: #a8c7fa; animation: b 0.7s infinite; }
    @keyframes b { 50% { opacity: 0; } }
    .m { padding: 12px 15px; border-radius: 16px; max-width: 82%; line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
    .u { background: #282a2c; align-self: flex-end; }
    .a { background: #1e1f20; border: 1px solid #333; align-self: flex-start; }
    .bar { display: flex; padding: 10px; gap: 8px; background: #131314; border-top: 1px solid #222; }
    input { flex: 1; padding: 12px 16px; border-radius: 22px; border: 1px solid #444; background: #1e1f20; color: #fff; font-size: 15px; outline: none; }
    .send { width: 46px; height: 46px; border-radius: 50%; border: none; background: linear-gradient(135deg, #4285f4, #9b72cb); color: #fff; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top">
    <span>✦ Uzmi AI</span>
  </div>
  <div id="chat"><div><span id="hi"></span><span class="cur"></span></div></div>
  <div class="bar">
    <input id="inp" placeholder="Istalgan savolingizni yozing..." onkeydown="if(event.key==='Enter') go()">
    <button class="send" onclick="go()">➤</button>
  </div>
  <script>
    const t = "Assalomu alaykum! Bugun sizga qanday yordam bera olaman?";
    let i = 0;
    function w() {
      if (i < t.length) {
        document.getElementById("hi").innerHTML += t.charAt(i++);
        setTimeout(w, 45);
      }
    }
    w();

    async function go() {
      const inp = document.getElementById("inp");
      const v = inp.value.trim();
      if (!v) return;

      add(v, "u");
      inp.value = "";
      const botDiv = add("O'ylamoqda...", "a");

      try {
        const prompt = "Sen o'zbek tilida javob beruvchi aqlli yordamchisan. Isming Uzmi AI. Savol: " + v;
        const response = await puter.ai.chat(prompt);
        const reply = response.message ? response.message.content : String(response);
        botDiv.textContent = "";
        typeReply(botDiv, reply);
      } catch (e) {
        botDiv.textContent = "Xatolik yuz berdi. Qayta urinib ko'ring.";
      }
    }

    function typeReply(el, text) {
      let idx = 0;
      function step() {
        if (idx < text.length) {
          el.textContent += text.charAt(idx++);
          const ch = document.getElementById("chat");
          ch.scrollTop = ch.scrollHeight;
          setTimeout(step, 15);
        }
      }
      step();
    }

    function add(txt, c) {
      const d = document.createElement("div");
      d.className = "m " + c;
      d.textContent = txt;
      const ch = document.getElementById("chat");
      ch.appendChild(d);
      ch.scrollTop = ch.scrollHeight;
      return d;
    }
  </script>
</body>
</html>
